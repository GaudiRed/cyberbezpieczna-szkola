name: Publikacja poradnika w GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Zbuduj i opublikuj aplikację
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zainstaluj zależności
        run: npm install --no-audit --no-fund
      - name: Weryfikacja typów
        run: npm run check
      - name: Zbuduj statyczną stronę
        run: npm run build
      - name: Zainstaluj Chromium do tworzenia PDF
        run: npx playwright install --with-deps chromium
      - name: Wygeneruj poradnik PDF z treści witryny
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cyber-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/cyberbezpieczna-szkola/poradnik-pdf/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/build-guide-pdf.mjs
      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prześlij pliki strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Publikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
